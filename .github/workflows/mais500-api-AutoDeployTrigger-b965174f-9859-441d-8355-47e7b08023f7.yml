name: Trigger auto deployment for mais500-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/mais500-api-AutoDeployTrigger-b965174f-9859-441d-8355-47e7b08023f7.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MAIS500API_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MAIS500API_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MAIS500API_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.MAIS500API_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MAIS500API_REGISTRY_PASSWORD }}
          containerAppName: mais500-api
          resourceGroup: mais500-backend-rg
          imageToBuild: peereiraandre12/mais500-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


